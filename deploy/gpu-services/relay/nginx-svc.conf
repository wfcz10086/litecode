# 放进 nginx 的 server { listen 443 ssl; … } 块里; http 块里另加:
#   limit_req_zone $binary_remote_addr zone=gpu_svc:10m rate=2r/s;
# <口令> 换成随机串: head -c 12 /dev/urandom | od -An -tx1 | tr -d " \n"

    # gpu-a asr (口令路径; 转发经 litecode-gpua-svc.service)
    location /svc/<口令>/asr/ {
        limit_req zone=gpu_svc burst=10 nodelay;
        client_max_body_size 200m;
        proxy_pass http://127.0.0.1:47011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
