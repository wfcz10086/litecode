<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例文档</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --ds-primary: #1F2A44; --ds-accent: #4F7EF7; }
  .hero { height: 70mm; margin: -22mm -20mm 8mm; background-size: cover; background-position: center; }
</style>
</head>
<body>

<section class="page">
  <div class="hero" data-need="现代办公室" data-kind="photo" data-query="modern office interior"></div>
  <h1>文档标题</h1>
  <p>导语: 两三句话说明这份文档是什么、给谁看、读完能得到什么。</p>
  <h2>一、背景</h2>
  <p>正文段落。A4 页面固定 210×297mm, 每页一个 <code>section.page</code>, 内容写多了会被 qa.py 报"内容被裁切", 拆到下一页。</p>
  <figure>
    <img data-need="数据中心机房" data-kind="photo" data-query="data center server room" style="width:100%;height:55mm;object-fit:cover">
    <figcaption>图 1 示例配图 <span data-credit></span></figcaption>
  </figure>
  <div class="page-footer"><span>示例文档</span><span>1</span></div>
</section>

<section class="page">
  <h2>二、数据</h2>
  <table>
    <tr><th>指标</th><th>2025</th><th>2026</th></tr>
    <tr><td>用户数</td><td>1.2 万</td><td>3.5 万</td></tr>
    <tr><td>满意度</td><td>86%</td><td>92%</td></tr>
  </table>
  <div class="grid-2">
    <div class="card"><h3>优势</h3><ul><li>部署快</li><li>成本低</li></ul></div>
    <div class="card"><h3>风险</h3><ul><li>依赖外部接口</li></ul></div>
  </div>
  <div class="credits" data-credits></div>
  <div class="page-footer"><span>示例文档</span><span>2</span></div>
</section>

</body>
</html>
