<body>
<div id="ls"><div class="lbox"><div class="ll">&#x26A1;</div><div class="lt">LiteCode</div><div class="ls2">AI Development Agent</div><input class="li_" id="lpwd" type="password" placeholder="密码" data-i18n-placeholder="login.password" autocomplete="current-password"><button class="lb_" onclick="doLogin()" data-i18n="login.sign_in">登录</button><div class="le" id="lerr" data-i18n="login.incorrect">密码错误</div></div></div>

<div id="imgModal" onclick="this.classList.remove('show')"><img id="imgModalImg" src="" alt="预览"></div>
<div id="ov" onclick="closeSB()"></div>
<div id="app">
  <div id="sb">
    <div id="sbh"><div class="logo"><div class="lm">&#x26A1;</div><span>Lite<span class="ld">Code</span></span></div><button id="ncb" onclick="newChat()" title="新建">+</button></div>
    <div id="sb-tools" style="padding:6px 8px;border-bottom:1px solid var(--bd)">

      <select id="sess-sort" onchange="renderSL()" style="width:100%;padding:3px 4px;font-size:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:4px;color:var(--tx);font-family:var(--mono)">
        <option value="recent">⏱ 最近活跃</option>
        <option value="name">🔤 名称</option>
        <option value="count">💬 消息数</option>
      </select>
    </div>
    <div id="sl"></div>
    <div id="sbf">
      <button class="sbt" onclick="openP('stats')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span data-i18n="nav.token_stats">用量统计</span></button>
      <button class="sbt" onclick="openP('memory')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span data-i18n="nav.memory">记忆</span></button>
      <button class="sbt" onclick="openP('wechat')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 2C5.46 2 3 4.46 3 7.5c0 1.63.71 3.1 1.83 4.12L4 14l2.76-1.38c.54.15 1.12.23 1.74.23.17 0 .34-.01.5-.02"/><path d="M15.5 8C12.46 8 10 10.46 10 13.5s2.46 5.5 5.5 5.5c.62 0 1.2-.08 1.74-.23L20 20l-.83-2.38C20.29 16.6 21 15.13 21 13.5 21 10.46 18.54 8 15.5 8z"/></svg><span data-i18n="nav.wechat">微信</span></button>
      <button class="sbt" onclick="openP('wecom')" title="企业微信智能机器人 (bot_id+secret 长连接)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><span>企微</span></button>
      <button class="sbt" onclick="openP('timer')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span data-i18n="nav.timer">定时任务</span></button>
      <button class="sbt" onclick="openP('sfiles')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg><span data-i18n="nav.workspace">工作区</span></button>
      <button class="sbt" onclick="openP('artifacts')" title="产出物 (timer/bg/plugin 生成)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>产出物</span></button>
      <button class="sbt" onclick="openP('bg')" title="后台任务 (bg shell/长跑进程)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span>后台</span></button>
      <button class="sbt" onclick="openP('docker')" title="Docker 容器管理 (ps/logs/stats/restart)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="4" height="4"/><rect x="9" y="10" width="4" height="4"/><rect x="15" y="10" width="4" height="4"/><rect x="9" y="5" width="4" height="4"/><path d="M2 17h20a4 4 0 01-4 4H6a4 4 0 01-4-4z"/></svg><span>Docker</span></button>
      <button class="sbt" onclick="openP('vnc')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span data-i18n="nav.desktop">桌面</span></button>
      <button class="sbt" onclick="openP('project')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><circle cx="12" cy="14" r="3"/></svg><span data-i18n="nav.projects">项目</span></button><button class="sbt" onclick="openDAGRouter()" title="DAG 编排 (Jenkins-lite · Pipeline/Build/Stage)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><line x1="8" y1="8" x2="11" y2="16"/><line x1="16" y1="8" x2="13" y2="16"/></svg><span data-i18n="nav.dag">DAG 编排</span></button><button class="sbt" onclick="openP('settings')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><span data-i18n="nav.settings">设置</span></button>

      <!-- v1.10 P34-d-10: 左下角模型徽标 + 服务器状态 -->
      <div id="sbf-status" class="sbf-status" onclick="quickSwitchModel(event)" title="点击切换模型">
        <div class="sbf-status-row">
          <span class="sbf-server-dot" id="sbf-srv-dot"></span>
          <span class="sbf-model-id" id="sbf-model-id">— 模型加载中 —</span>
        </div>
        <div class="sbf-status-row">
          <span class="sbf-srv-label" id="sbf-srv-label">Server</span>
          <span class="sbf-srv-status" id="sbf-srv-status" data-i18n="status.checking">检查中…</span>
        </div>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="hdr"><button id="mbu" onclick="togSB()">&#x2630;</button><span id="ct" ondblclick="renameCurSession()" title="双击重命名" style="cursor:pointer" data-i18n="btn.new_chat">新建会话</span><span class="hp" id="mpill">&#x2014;</span><button id="ib" onclick="interrupt()" data-i18n="btn.stop">&#x23F9; 停止</button><button class="abtn" id="exp-btn" onclick="exportSession()" style="font-size:10px;padding:2px 8px;margin-left:4px;display:none" data-i18n="btn.export">&#x2B07; 导出</button><button class="abtn" onclick="openP('vnc')" title="桌面预览 (noVNC)" style="font-size:11px;padding:2px 8px;margin-left:auto">🖥️ 桌面</button><button class="abtn" id="theme-btn" onclick="toggleThemeMenu(event)" title="切换主题" style="padding:2px 8px;font-size:11px;position:relative">🎨 主题</button><button class="abtn" onclick="I18N.setLocale(I18N.locale==='zh'?'en':'zh')" style="padding:2px 8px;font-size:11px" data-i18n="i18n.toggle">🌐 中/EN</button></div>
    <div id="mw"><div id="msgs"><div id="empty"><div class="elogo">&#x26A1;</div><div class="etitle">LiteCode Agent</div><div class="ehint" data-i18n="welcome.subtitle">具备工具调用、记忆和多代理流水线的 AI 助手。</div><div class="sugs"><button class="sg" onclick="sug('&#x5199;&#x4E00;&#x4E2A; FastAPI &#x63A5;&#x53E3;&#x670D;&#x52A1;')">FastAPI &#x670D;&#x52A1;</button><button class="sg" onclick="sug('&#x5206;&#x6790;&#x9879;&#x76EE;&#x4EE3;&#x7801;&#x7ED3;&#x6784;')">&#x5206;&#x6790;&#x4EE3;&#x7801;</button><button class="sg" onclick="sug('&#x5E2E;&#x6211;&#x8C03;&#x8BD5;&#x8FD9;&#x4E2A; bug')">&#x8C03;&#x8BD5; Bug</button><button class="sg" onclick="sug('&#x641C;&#x7D22;&#x6700;&#x65B0; AI &#x8D44;&#x8BAF;')">&#x641C;&#x7D22;&#x8D44;&#x8BAF;</button></div></div></div></div>
    <div id="ia"><div id="pfp"></div><div id="irow"><div id="iw"><textarea id="mi" placeholder="&#x6D88;&#x606F; LiteCode&#x2026;" rows="1" onkeydown="onK(event)" oninput="arx(this)"></textarea><button id="upb" onclick="document.getElementById('fi').click()" title="&#x4E0A;&#x4F20; (&#x53EF;&#x591A;&#x9009;)">&#x1F4CE;</button><button id="thk" onclick="cycleThink()" title="&#x63A8;&#x7406;&#x5F3A;&#x5EA6;: &#x70B9;&#x5207;&#x6362; off/&#x4F4E;/&#x4E2D;/&#x9AD8;" style="background:transparent;border:1px solid var(--bd2);color:var(--tx2);border-radius:12px;padding:2px 10px;font-size:11px;cursor:pointer;margin-left:4px;white-space:nowrap">&#x1F9E0; &#x4E2D;</button><button id="strat" onclick="toggleStrat()" title="&#x6743;&#x8C0B;/&#x591A;&#x65B9;&#x535A;&#x5F08;&#x63A8;&#x6F14;&#x6A21;&#x5F0F;: &#x62C6;&#x5229;&#x76CA;/&#x535A;&#x5F08;/&#x53D8;&#x91CF;/&#x6B63;&#x53CD;&#x9762;&#x3002;&#x884C;&#x60C5;&#x3001;AI&#x6CE1;&#x6CAB;&#x3001;&#x804A;&#x5929;&#x622A;&#x56FE;&#x611F;&#x60C5;&#x535A;&#x5F08;&#x90FD;&#x9002;&#x7528;" style="background:transparent;border:1px solid var(--bd2);color:var(--tx2);border-radius:12px;padding:2px 10px;font-size:11px;cursor:pointer;margin-left:4px;white-space:nowrap">&#x1F3AD; &#x63A8;&#x6F14;</button></div><button id="sdb" onclick="send()">&#x2191;</button></div><input type="file" id="fi" multiple onchange="upFile(this)"></div>
  </div>
</div>
<div class="pnl" id="pnl-stats" onclick="if(event.target===this)closeP('stats')"><div class="pb_"><div class="ph_"><span class="pt_" data-i18n="panel.token_usage">&#x1F4CA; 用量统计</span><button class="px_" onclick="closeP('stats')">&#xD7;</button></div><div class="pbd_" id="stats-bd" data-i18n="status.loading">加载中…</div></div></div>
<div class="pnl" id="pnl-memory" onclick="if(event.target===this)closeP('memory')"><div class="pb_"><div class="ph_"><span class="pt_" id="mtitle" data-i18n="panel.memory">&#x1F9E0; 记忆</span><button class="px_" onclick="closeP('memory')">&#xD7;</button></div><div class="pbd_" id="mem-bd" data-i18n="status.select_session">选择一个会话</div></div></div>
<div class="pnl" id="pnl-project" onclick="if(event.target===this)closeP(&apos;project&apos;)"><div class="pb_"><div class="ph_"><span class="pt_" data-i18n="panel.projects">&#x1F4C2; 项目</span><button class="px_" onclick="closeP(&apos;project&apos;)">&#xD7;</button></div><div class="pbd_" id="proj-bd" data-i18n="status.loading">加载中…</div></div></div>
<div class="pnl" id="pnl-settings" onclick="if(event.target===this)closeP('settings')"><div class="pb_"><div class="ph_"><span class="pt_" data-i18n="panel.settings">&#x2699;&#xFE0F; 设置</span><button class="px_" onclick="closeP('settings')">&#xD7;</button></div><div class="pbd_" id="set-bd" data-i18n="status.loading">加载中…</div></div></div>
<div class="pnl" id="pnl-wechat" onclick="if(event.target===this)closeP('wechat')"><div class="pb_" style="max-width:520px"><div class="ph_"><span class="pt_" data-i18n="panel.wechat">💬 微信管理</span><button class="px_" onclick="closeP('wechat')">&#xD7;</button></div><div class="pbd_" id="wx-bd" style="max-height:72vh;overflow-y:auto" data-i18n="status.loading">加载中…</div></div></div>
<div class="pnl" id="pnl-wecom" onclick="if(event.target===this)closeP('wecom')"><div class="pb_" style="max-width:620px"><div class="ph_"><span class="pt_">🏢 企微管理</span><button class="px_" onclick="closeP('wecom')">&#xD7;</button></div><div class="pbd_" id="wc-bd" style="max-height:75vh;overflow-y:auto">加载中…</div></div></div>
<div class="pnl" id="pnl-timer" onclick="if(event.target===this)closeP('timer')"><div class="pb_" style="max-width:520px"><div class="ph_"><span class="pt_" data-i18n="panel.timer">⏰ 定时器</span><button class="px_" onclick="closeP('timer')">&#xD7;</button></div><div class="pbd_" id="timer-bd" style="max-height:72vh;overflow-y:auto" data-i18n="status.loading">加载中…</div></div></div>
<div class="pnl" id="pnl-sfiles" onclick="if(event.target===this)closeP('sfiles')"><div class="pb_" style="max-width:620px"><div class="ph_"><span class="pt_" id="sf-title" data-i18n="panel.workspace">📁 工作区</span><button class="px_" onclick="closeP('sfiles')">&#xD7;</button></div><div class="pbd_" id="sf-bd" style="max-height:75vh;overflow-y:auto" data-i18n="status.loading">加载中…</div></div></div>
<div class="pnl" id="pnl-artifacts" onclick="if(event.target===this)closeP('artifacts')"><div class="pb_" style="max-width:760px"><div class="ph_"><span class="pt_">📦 产出物</span><a class="abtn" href="/artifacts" target="_blank" style="font-size:11px;padding:2px 8px;text-decoration:none;margin-left:auto;margin-right:8px">↗ 全屏</a><button class="px_" onclick="closeP('artifacts')">&#xD7;</button></div><div class="pbd_" id="art-bd" style="max-height:75vh;overflow-y:auto">加载中…</div></div></div>
<div class="pnl" id="pnl-bg" onclick="if(event.target===this)closeP('bg')"><div class="pb_" style="max-width:640px"><div class="ph_"><span class="pt_">⚙️ 后台任务</span><button class="px_" onclick="closeP('bg')">&#xD7;</button></div><div class="pbd_" id="bg-bd" style="max-height:75vh;overflow-y:auto">加载中…</div></div></div>
<div class="pnl" id="pnl-docker" onclick="if(event.target===this)closeP('docker')"><div class="pb_" style="max-width:820px"><div class="ph_"><span class="pt_">🐳 Docker</span><button class="abtn" onclick="renderDocker()" style="font-size:11px;padding:2px 10px;margin-left:auto;margin-right:8px">🔄 刷新</button><button class="px_" onclick="closeP('docker')">&#xD7;</button></div><div class="pbd_" id="docker-bd" style="max-height:78vh;overflow-y:auto">加载中…</div></div></div>
<!-- VNC 全屏桌面面板 -->
<div class="pnl" id="pnl-vnc" onclick="if(event.target===this)closeP('vnc')" style="padding:0">
  <div style="background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rr);width:92vw;max-width:1200px;height:88vh;display:flex;flex-direction:column;animation:su .2s ease">
    <div class="ph_">
      <span class="pt_">🖥️ Desktop (noVNC)</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="vnc-status" style="font-size:11px;font-family:var(--mono);color:var(--tx3)">未连接</span>
        <button class="abtn" onclick="renderVnc()" style="font-size:10px;padding:2px 8px">🔄 刷新</button>
        <a id="vnc-newwin" href="#" target="_blank" class="abtn" style="font-size:10px;padding:2px 8px;text-decoration:none">↗ 新窗口</a>
        <button class="px_" onclick="closeP('vnc')">&#xD7;</button>
      </div>
    </div>
    <div style="flex:1;position:relative;background:#000;border-radius:0 0 var(--rr) var(--rr);overflow:hidden">
      <iframe id="novnc-frame" src="about:blank" style="width:100%;height:100%;border:none;background:#000"></iframe>
    </div>
  </div>
</div>
<!-- [P0-6 2026-07-24] 只保留 X6 编辑器. 旧 #pnl-dag / #dag-canvas / #dag-floating-indicator 已删.
