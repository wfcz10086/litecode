# SearXNG 最小配置 — JSON API + 关速率限制 (自用本机)
# [2026-07-24] 修: 上游 brave/ddg/startpage 全部 CAPTCHA/suspended,
# 换成 bing/yandex/sogou/baidu/360search — 实测均返回 6-10 条.
use_default_settings: true
general:
  debug: false
  instance_name: "LiteCode SearXNG"
server:
  secret_key: "CHANGE_ME_SEARXNG_SECRET"
  limiter: false
  image_proxy: false
  port: 8888
  bind_address: "127.0.0.1"
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
ui:
  static_use_hash: true
engines:
  # ── 关掉批量 CAPTCHA / 抛异常的 ──
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true
  # [2026-10-22] 实测停用 bing(日本区, 中文相关率 12%), sogou/baidu(持续 CAPTCHA 返回空)
  # ── 打开实测稳定的 ──
  - name: bing
    disabled: true
    shortcut: bi
    engine: bing
    timeout: 5.0
  - name: yandex
    disabled: false
    shortcut: yd
    engine: yandex
    timeout: 6.0
  - name: sogou
    disabled: true
    shortcut: sg
    engine: sogou
    timeout: 5.0
  - name: baidu
    disabled: true
    shortcut: bd
    engine: baidu
    timeout: 5.0
  - name: 360search
    disabled: false
    shortcut: 360
    engine: 360search
    timeout: 5.0
